# Motor de Reglas -- Modulo 4, Submodulo 4.2 (Normalizador Universal)
#
# Nombres de pila comunes, usados SOLO para deducir el orden real de una
# columna combinada de nombre ("Apellidos y Nombres" vs "Nombres y
# Apellidos") cuando el contenido contradice al encabezado. Caso real:
# el numeral 2 del GAD Municipal de Zapotillo (agosto 2026) dice
# "Apellidos y Nombres" en el encabezado pero trae "Grecia Catarina
# Moncada Sanchez" -- confiar en el encabezado invertia los nombres y la
# busqueda posterior no encontraba a nadie.
#
# Origen: derivada de ~5 400 filas reales del numeral 2 DPE (32 archivos,
# 2026-09) con segmentacion de confianza alta, conservando solo palabras
# que aparecen al menos 3 veces como nombre y al menos 4 veces mas como
# nombre que como apellido; se quitaron a mano palabras ambiguas
# (BOLIVAR, COLON) y apellidos que se colaban. Es una lista de palabras,
# no de personas: agregar o quitar un nombre es editar este archivo.
#
# La decision es por ARCHIVO, no por fila (ver
# `segmentador_nombre.detectar_orden_por_contenido`): hace falta una
# mayoria clara de filas para contradecir al encabezado.
