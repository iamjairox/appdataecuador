[project]
name = "govdata-intelligence-platform"
version = "0.1.0"
description = "Plataforma de automatizacion e inteligencia de datos publicos del Estado ecuatoriano (Transparencia, SENESCYT, Funcion Judicial, ...)"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "camelot-py[cv]>=0.11",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "tenacity>=9.0",
    "redis>=5.0",
    "rq>=1.16",
    "minio>=7.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.0",  # solo para (re)generar fixtures PDF de prueba, ver tests/fixtures/*/_generar.py
    "httpx>=0.27",  # TestClient de FastAPI (Modulo 10)
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/govdata"]
omit = [
    # Puertos (interfaces puras, solo `abstractmethod` sin cuerpo) de
    # modulos FUTUROS (SENESCYT/Funcion Judicial, extraccion, identity
    # resolution) sin ninguna implementacion todavia -- no hay nada
    # ejecutable que cubrir hasta que exista un adaptador real.
    # `file_storage_port` y `http_fetcher_port` se retiraron de esta lista
    # en el Modulo 3: ya tienen implementaciones reales y cubiertas
    # (Local/MinioStorageAdapter, RequestsHttpFetcherAdapter).
    "src/govdata/application/ports/document_parser_port.py",
    "src/govdata/application/ports/funcionario_repository_port.py",
    "src/govdata/application/ports/historial_cambios_repository_port.py",
    "src/govdata/application/ports/identity_resolution_port.py",
    "src/govdata/application/ports/notifier_port.py",
    "src/govdata/application/ports/persona_repository_port.py",
    "src/govdata/application/ports/queue_port.py",
    "src/govdata/application/dto/fila_extraida_dto.py",
    # Script de Alembic (infraestructura de tooling, no logica de negocio;
    # se prueba ejecutando `alembic upgrade head` contra Postgres real,
    # no con pytest).
    "src/govdata/infrastructure/persistence/migrations/env.py",
]

[tool.coverage.report]
exclude_also = [
    "^\\s*\\.\\.\\.\\s*$",  # cuerpos de @abstractmethod
    "if TYPE_CHECKING:",
]
